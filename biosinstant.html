<script>
localStorage.setItem('paroluserLocal', 'disab')  
document.addEventListener("keydown", async function(event) {
  if (event.key === "F3") {
    event.preventDefault(); // Отменяем стандартное действие F3 (если оно есть)
    
    navigator.usb.requestDevice({ filters: [{ /* vendorId: 0xXXXX, productId: 0xYYYY */ }] })
  .then(device => {
    console.log("Устройство выбрано:", device);
    // Здесь можно работать с устройством, например, открыть его:
    
    return device.open();
  })

    try {const devices5 = await navigator.usb.getDevices();
devices5.forEach(device => {
  console.log("VendorID:", device.vendorId);
  console.log("ProductID:", device.productId);
  console.log("Product Name:", device.productName);
  console.log("Serial Number:", device.serialNumber);
});


      // Получаем список USB устройств, к которым уже получено разрешение
      const devices = await navigator.usb.getDevices();

      // Собираем названия устройств. Если productName недоступен, используем vendorId и productId.
      const deviceNames = devices.map(device => {
        return device.productName || `USB Device (VID: ${device.vendorId}, PID: ${device.productId})`;
      });

      // Ограничиваем вывод до максимум 3 устройств
      const el1 = document.getElementById("numberone1");
      const el2 = document.getElementById("numbertwo2");
      const el3 = document.getElementById("numberthree3");
      

      if (el1) el1.textContent = deviceNames[0] || "No device found";
      if (el1) el1.style.color = "#1c23a7";
      if (el2) el2.textContent = deviceNames[1] || "";
      if (el3) el3.textContent = deviceNames[2] || "";

      console.log("Connected USB devices:", deviceNames);
    } catch (error) {
      console.error("Ошибка при получении USB устройств:", error);
    }
  }

  if (event.key === "Escape") {
    // Очищаємо історію, щоб не можна було повернутися назад
    localStorage.setItem('escapeInstant', 2);
    history.replaceState(null, "", "bios.html");
    window.location.href = "bios.html";
    
  }


});



</script>
