<!DOCTYPE html>
<html>
<head>
  <title>Регистрация</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link href="regstyle.css" rel="stylesheet">
  <link href="notifications.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&family=Raleway:wght@400;600;700&display=swap');
    .regg{
      color: rgb(68, 0, 255);
    }
  </style>
</head>
<body>
  <div class="project-name" id="projectName">MartynenkoProject ●</div>
  <form id="registrationForm" action="save_to_file.php" method="post" novalidate>
    <div class="container">
      <h2>Реєстрація</h2>
      <br>
      <div class="form-group">
        <input type="text" id="first_name" name="first_name" required placeholder=" " autocomplete="given-name">
        <label for="first_name" id="frstname">Ім'я</label>
      </div>
      <div class="form-group">
        <input type="text" id="second_name" name="second_name" required placeholder=" " autocomplete="family-name">
        <label for="second_name" id="labSecond">Прізвище</label>
      </div>
      <div class="form-group">
        <input type="password" id="ph_password" name="password" required placeholder=" " autocomplete="new-password">
        <label for="ph_password" id="labPass">Пароль</label>
        <small style="color: #666; font-size: 12px; margin-top: 5px; display: block;">
          • Мінімум 12 символів<br>
          • Великі та малі літери<br>
          • Цифри та спеціальні символи (!@#$%^&*)
        </small>
      </div>
      <div class="form-group">
        <input type="password" id="ph_confirm_password" name="confirm_password" required placeholder=" " autocomplete="new-password">
        <label for="ph_confirm_password" id="labConfirm">Підтвердіть пароль</label>
      </div>
      <div id="message" class="error" style="display: none;">Паролі не збігаються!</div>
      <div id="successMessage" class="success" style="display: none;">Паролі збігаються.</div>
      <div id="passwordStrength" class="password-strength" style="display: none;">
        <strong>Сила пароля:</strong>
        <div id="strengthBar" style="height: 5px; background: #ddd; border-radius: 3px; overflow: hidden;">
          <div id="strengthFill" style="height: 100%; background: red; width: 0%; transition: width 0.3s;"></div>
        </div>
      </div>
      <input type="hidden" id="csrf_token" name="csrf_token" value="">
      <button type="submit" id="next">Продовжити</button>
      <br>
      <br>
      <div class="reg"> У вас уже є обліковий запис? <a class="regg" href="login.html"> Увійти </a></div>
    </div>
  </form>

  <script src="notifications.js"></script>
  <script>
    // Security: Load CSRF token from session
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('get_csrf_token.php');
        const data = await response.json();
        if (data.csrf_token) {
          document.getElementById('csrf_token').value = data.csrf_token;
        }
      } catch (e) {
        console.error('Failed to load CSRF token');
        notify.error('Помилка', 'Не вдалося завантажити токен безпеки');
      }
    });

    const form = document.getElementById('registrationForm');
    const password = document.getElementById('ph_password');
    const confirmPassword = document.getElementById('ph_confirm_password');
    const passwordStrength = document.getElementById('passwordStrength');
    const strengthFill = document.getElementById('strengthFill');

    // Password strength checker
    function checkPasswordStrength(pwd) {
      let strength = 0;
      if (pwd.length >= 12) strength += 1;
      if (pwd.length >= 16) strength += 1;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) strength += 1;
      if (/[0-9]/.test(pwd)) strength += 1;
      if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) strength += 1;
      return strength;
    }

    // Real-time password validation
    confirmPassword.addEventListener('input', () => {
      if (password.value === confirmPassword.value && password.value !== '') {
        // Passwords match
      } else if (password.value !== confirmPassword.value && confirmPassword.value !== '') {
        notify.warning('Увага', 'Паролі не збігаються', { duration: 2000 });
      }
    });

    password.addEventListener('input', () => {
      const strength = checkPasswordStrength(password.value);
      const colors = ['#ff0000', '#ff6600', '#ffcc00', '#99ff00', '#00ff00'];
      const widths = ['20%', '40%', '60%', '80%', '100%'];

      if (password.value.length > 0) {
        passwordStrength.style.display = 'block';
        strengthFill.style.backgroundColor = colors[strength - 1] || '#ff0000';
        strengthFill.style.width = widths[strength - 1] || '20%';
      } else {
        passwordStrength.style.display = 'none';
      }

      // Trigger confirm password re-check
      if (confirmPassword.value !== '') {
        confirmPassword.dispatchEvent(new Event('input'));
      }
    });

    // Form submission validation
    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const firstName = document.getElementById('first_name').value.trim();
      const secondName = document.getElementById('second_name').value.trim();
      const pwd = password.value;
      const confirmPwd = confirmPassword.value;

      // Client-side validation
      if (!firstName || !secondName) {
        notify.error('Помилка', 'Заповніть ім\'я та прізвище');
        return;
      }

      if (pwd.length < 12) {
        notify.error('Слабкий пароль', 'Пароль повинен містити мінімум 12 символів');
        return;
      }

      if (pwd !== confirmPwd) {
        notify.error('Паролі не збігаються', 'Перевірте, що обидва паролі однакові');
        return;
      }

      const strength = checkPasswordStrength(pwd);
      if (strength < 3) {
        notify.error('Слабкий пароль', 'Додайте великі літери, цифри та спеціальні символи');
        return;
      }

      // Submit form
      try {
        const formData = new FormData(form);
        const response = await fetch('save_to_file.php', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          notify.success('Вітаємо!', 'Реєстрація успішна. Перенаправлення...', { duration: 2000 });
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          if (response.status === 409) {
            notify.error('Користувач існує', 'Користувач з таким іменем вже зареєстрований');
          } else if (response.status === 429) {
            notify.error('Занадто багато спроб', 'Спробуйте ще раз пізніше');
          } else if (response.status === 400) {
            notify.error('Помилка валідації', data.error || 'Перевірте введені дані');
          } else {
            notify.error('Помилка', data.error || 'Помилка при реєстрації');
          }
        }
      } catch (e) {
        console.error('Error:', e);
        notify.error('Помилка підключення', 'Не вдалося з\'єднатися з сервером');
      }
    });
  </script>
  <script src="scripts/registrationForm.js"></script>
</body>
</html>
