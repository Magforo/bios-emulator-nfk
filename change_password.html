<!DOCTYPE html>
<html>
<head>
  <title>Смена пароля</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="regstyle.css" rel="stylesheet">
  <link href="notifications.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&family=Raleway:wght@400;600;700&display=swap');
    
    .info-text {
      color: #666;
      font-size: 12px;
      margin-top: 5px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="project-name" id="projectName">MartynenkoProject ●</div>
  <form id="passwordForm" action="change_password.php" method="post" novalidate>
    <div class="container">
      <h2>Смена пароля</h2>
      <br>
      
      <div class="form-group">
        <input type="password" id="old_password" name="old_password" required placeholder=" " autocomplete="current-password">
        <label for="old_password">Поточний пароль</label>
        <div class="info-text">Для підтвердження вкажіть ваш поточний пароль</div>
      </div>
      
      <div class="form-group">
        <input type="password" id="new_password" name="new_password" required placeholder=" " autocomplete="new-password">
        <label for="new_password">Новий пароль</label>
        <div class="info-text">
          • Мінімум 12 символів<br>
          • Великі та малі літери<br>
          • Цифри та спеціальні символи (!@#$%^&*)
        </div>
      </div>
      
      <div id="passwordStrength" style="display: none;">
        <strong>Сила пароля:</strong>
        <div style="height: 5px; background: #ddd; border-radius: 3px; overflow: hidden;">
          <div id="strengthFill" style="height: 100%; background: red; width: 0%; transition: width 0.3s;"></div>
        </div>
      </div>
      
      <div class="form-group">
        <input type="password" id="confirm_password" name="confirm_password" required placeholder=" " autocomplete="new-password">
        <label for="confirm_password">Підтвердіть новий пароль</label>
      </div>
      
      <input type="hidden" id="csrf_token" name="csrf_token" value="">
      
      <button type="submit" id="submitBtn">Змінити пароль</button>
      <br>
      <br>
      <a href="bios.html" style="color: rgb(68, 0, 255); text-decoration: none;">← Повернутися</a>
    </div>
  </form>

  <script src="notifications.js"></script>
  <script>
    // Load CSRF token
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('get_csrf_token.php');
        const data = await response.json();
        if (data.csrf_token) {
          document.getElementById('csrf_token').value = data.csrf_token;
        }
      } catch (e) {
        console.error('Failed to load CSRF token');
        notify.error('Помилка', 'Не вдалося завантажити токен безпеки');
      }
    });

    const form = document.getElementById('passwordForm');
    const oldPassword = document.getElementById('old_password');
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    const passwordStrength = document.getElementById('passwordStrength');
    const strengthFill = document.getElementById('strengthFill');

    // Password strength checker
    function checkPasswordStrength(pwd) {
      let strength = 0;
      if (pwd.length >= 12) strength += 1;
      if (pwd.length >= 16) strength += 1;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) strength += 1;
      if (/[0-9]/.test(pwd)) strength += 1;
      if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) strength += 1;
      return strength;
    }

    // Check password strength
    newPassword.addEventListener('input', () => {
      const strength = checkPasswordStrength(newPassword.value);
      const colors = ['#ff0000', '#ff6600', '#ffcc00', '#99ff00', '#00ff00'];
      const widths = ['20%', '40%', '60%', '80%', '100%'];

      if (newPassword.value.length > 0) {
        passwordStrength.style.display = 'block';
        strengthFill.style.backgroundColor = colors[strength - 1] || '#ff0000';
        strengthFill.style.width = widths[strength - 1] || '20%';
      } else {
        passwordStrength.style.display = 'none';
      }

      // Re-check confirm password
      if (confirmPassword.value !== '') {
        confirmPassword.dispatchEvent(new Event('input'));
      }
    });

    // Check password match
    confirmPassword.addEventListener('input', () => {
      if (newPassword.value === confirmPassword.value && newPassword.value !== '') {
        // Passwords match
      } else if (newPassword.value !== confirmPassword.value && confirmPassword.value !== '') {
        notify.warning('Увага', 'Паролі не збігаються', { duration: 2000 });
      }
    });

    // Form submission
    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const oldPwd = oldPassword.value;
      const newPwd = newPassword.value;
      const confirmPwd = confirmPassword.value;

      // Client-side validation
      if (!oldPwd || !newPwd || !confirmPwd) {
        notify.error('Помилка', 'Заповніть усі поля');
        return;
      }

      if (oldPwd === newPwd) {
        notify.error('Помилка', 'Новий пароль повинен відрізнятися від поточного');
        return;
      }

      if (newPwd !== confirmPwd) {
        notify.error('Паролі не збігаються', 'Перевірте, що обидва паролі однакові');
        return;
      }

      if (newPwd.length < 12) {
        notify.error('Слабкий пароль', 'Пароль повинен містити мінімум 12 символів');
        return;
      }

      const strength = checkPasswordStrength(newPwd);
      if (strength < 3) {
        notify.error('Слабкий пароль', 'Додайте великі літери, цифри та спеціальні символи');
        return;
      }

      // Send to server
      try {
        const formData = new FormData(form);
        const response = await fetch('change_password.php', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          notify.success('Вітаємо!', 'Пароль успішно змінено', { duration: 2000 });
          form.reset();
          // Redirect after notification
          setTimeout(() => {
            window.location.href = 'bios.html';
          }, 2000);
        } else {
          notify.error('Помилка', data.error || 'Помилка при зміні пароля');
        }
      } catch (e) {
        console.error('Error:', e);
        notify.error('Помилка підключення', 'Не вдалося з\'єднатися з сервером');
      }
    });
  </script>
</body>
</html>
